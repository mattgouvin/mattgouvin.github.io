---
layout: default
title: Writing
---

<div class="writing-page">
  {% if site.posts.size > 0 %}
  <ul class="all-posts">
    {% for post in site.posts %}
    <li>
      <a href="{{ post.url }}" class="title">{{ post.title }}</a>
      <span class="date">{{ post.date | date: "%B %-d, %Y" }}</span>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p>No posts yet.</p>
  {% endif %}
</div>
